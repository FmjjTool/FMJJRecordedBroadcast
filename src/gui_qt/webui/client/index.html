<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面镜像</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="topbar">
  <span id="brand">页面镜像</span>
  <select id="pageSelect" title="切换页面"><option value="">加载中…</option></select>
  <span id="pageTitle"></span>
  <span class="spacer"></span>
  <button class="tool" id="zoomFit" type="button" title="缩放到窗口宽度">适应</button>
  <button class="tool" id="zoomOut" type="button" title="缩小">－</button>
  <button class="tool" id="zoomIn" type="button" title="放大">＋</button>
  <button class="tool" id="refresh" type="button" title="立即获取最新快照">刷新</button>
  <span id="conn">连接中…</span>
</div>
<div id="stage"><div id="fit"><div id="canvas"></div></div></div>
<div id="statusbar">
  <span id="statusText">等待页面快照…</span>
  <span id="statusPage"></span>
</div>
<div id="hint"><div class="box" id="hintText"></div></div>
<script src="/app.js"></script>
</body>
</html>

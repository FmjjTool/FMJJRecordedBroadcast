<!doctype html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>录播工具箱 WebUI</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-name">录播工具箱</div>
      <div class="brand-sub">Web 服务端</div>
    </div>
    <nav id="nav">
      <button class="nav-item nav-home" data-route="home" title="查看各模块本地数据概览" aria-label="工作台：数据概览">工作台</button>
      <div class="nav-group-title">内容采集</div>
      <button class="nav-item" data-route="info_accounts">采集任务</button>
      <button class="nav-item" data-route="collected">采集结果</button>
      <button class="nav-item" data-route="info_tools">采集工具</button>
      <div class="nav-group-title">资产管理</div>
      <button class="nav-item" data-route="assets">资产库</button>
      <button class="nav-item" data-route="netdisk">网络库</button>
      <div class="nav-group-title">录播工具箱</div>
      <button class="nav-item" data-route="organize">自动整理</button>
      <button class="nav-item" data-route="editor">视频操作</button>
      <button class="nav-item" data-route="rename">命名投稿</button>
      <button class="nav-item" data-route="audio">音频提取</button>
      <button class="nav-item" data-route="subtitle">字幕转换</button>
      <button class="nav-item" data-route="launcher">继续操作</button>
      <button class="nav-item" data-route="calendar">日历浏览</button>
      <button class="nav-item" data-route="migrate">文件迁移</button>
      <div class="nav-group-title">账户追踪</div>
      <button class="nav-item" data-route="music_tracker">音乐账号</button>
      <button class="nav-item" data-route="media_tracker">网媒账号</button>
            <button class="nav-item" data-route="douyin_index" title="抓取指数快照并回写已有抖音资产">抖音指数</button>
      <button class="nav-item" data-route="tcdoc">腾讯文档</button>
      <button class="nav-item" data-route="weibo_chaohua">微博超话</button>
      <button class="nav-item" data-route="fan_groups">粉丝群</button>
      <div class="nav-group-title">票务购物</div>
      <button class="nav-item" data-route="tickets" title="按勾选的平台解析演出与导出">票务解析</button>
      <button class="nav-item" data-route="shopping" title="购物链接解析、闲鱼分页搜索与跨页入库下载">购物解析</button>
      <div class="nav-group-title">音乐工具</div>
      <button class="nav-item" data-route="music_download" title="音乐下载 · 最高可用音质">下载</button>
      <button class="nav-item" data-route="music_playlist">歌单</button>
      <button class="nav-item" data-route="music_tag" title="标签编辑、封面提取、历史快照与编码修复">标签</button>
      <div class="nav-group-title">直播录制</div>
      <button class="nav-item" data-route="record" title="开播监控、直播录制与 FLV / TS 修复">直播录制</button>
      <div class="nav-group-title">本地工具</div>
      <button class="nav-item" data-route="localwiki">资料站</button>
      <button class="nav-item" data-route="livestream_summary">直播总结</button>
      <button class="nav-item" data-route="image_crop">图片裁切</button>
      <button class="nav-item" data-route="cover_maker">封面制作</button>
      <button class="nav-item" data-route="certificate_maker" title="证书记录批量选择与加密证据导出">证书制作</button>
      <button class="nav-item" data-route="image_sorter">媒体筛选</button>
      <button class="nav-item" data-route="rename_batch">批量改名</button>
      <div class="nav-group-title">网络</div>
      <button class="nav-item" data-route="proxy">网络代理</button>
      <div class="nav-group-title">全局</div>
      <button class="nav-item" data-route="tasks">任务</button>
      <button class="nav-item" data-route="system">设置</button>
      <button class="nav-item" data-route="performance" title="本机读数与桌面启动自动监控设置">性能诊断</button>
    </nav>
    <div class="sidebar-foot">
      <span class="dot" id="serverDot"></span>
      <span id="serverState">连接中</span>
    </div>
  </aside>
  <div id="scrim"></div>
  <main id="main">
    <header id="topbar">
      <button id="menuBtn" class="icon-btn" type="button" title="打开导航">菜单</button>
      <h1 id="pageTitle">工作台</h1>
      <div class="spacer"></div>
      <button id="themeBtn" class="btn ghost" type="button">深色</button>
      <button id="refreshBtn" class="btn" type="button">刷新</button>
    </header>
    <section id="content" aria-live="polite"></section>
  </main>
</div>
<div id="toast" class="toast hidden"></div>
<div id="gate" class="gate hidden">
  <div class="gate-box">
    <h2>需要访问令牌</h2>
    <p>请使用 <code>config/webui_url.txt</code> 中的完整地址打开，或在启动命令中指定
      <code>--webui-token</code>。登录后换取短期会话（12 小时），令牌不会保存在浏览器中。</p>
    <label class="gate-input">令牌
      <input id="gateToken" type="text" autocomplete="off" placeholder="粘贴访问令牌">
    </label>
    <button id="gateSubmit" class="btn primary" type="button">进入</button>
    <p id="gateError" class="gate-error"></p>
  </div>
</div>
<script src="/cover_automation.js"></script>
<script src="/local_llm.js"></script>
<script src="/performance_reports.js"></script>
<script src="/tcdoc_versions.js"></script>
<script src="/tcdoc_mapping.js"></script>
<script src="/music_pictures.js"></script>
<script src="/music_match.js"></script>
<script src="/music_rename.js"></script>
<script src="/music_export.js"></script>
<script src="/music_resolve.js"></script>
<script src="/shopping_export.js"></script>
<script src="/video_comments.js"></script>
<script src="/wechat_library.js"></script>
<script src="/app.js"></script>
</body>
</html>
